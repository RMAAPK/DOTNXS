<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c18" />
    <title>DOTNXS · Render ping</title>
    <script defer src="/config.js"></script>
    <script defer src="/ping.js"></script>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080c18; color: #f2f5ff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(620px, calc(100% - 32px)); padding: 28px; border: 1px solid #26304a; border-radius: 18px; background: #11182b; }
      h1 { margin: 0 0 10px; }
      p { color: #aab4cc; line-height: 1.6; }
      button { border: 0; border-radius: 10px; padding: 12px 18px; color: #071318; background: #64e5da; font-weight: 800; cursor: pointer; }
      #result { min-height: 28px; margin-top: 18px; color: #69e3a5; font-family: monospace; }
      label { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: #c4cde0; font-size: 14px; }
      a { color: #64e5da; }
    </style>
  </head>
  <body>
    <main>
      <h1>DOTNXS Render ping</h1>
      <p>This page sends <code>GET /ping</code> to the Render C++ API. The endpoint answers <code>pong</code> without loading the model.</p>
      <button id="ping-button" type="button">Ping now</button>
      <label><input id="auto-ping" type="checkbox" checked /> Repeat every 10 minutes while this page stays open</label>
      <div id="result" role="status">Waiting to ping…</div>
      <p>For external uptime checks, request <code id="endpoint">/ping</code>. Render Free services still have monthly instance-hour limits; pings do not bypass those limits.</p>
      <a href="/">Back to chat</a>
    </main>
  </body>
</html>
