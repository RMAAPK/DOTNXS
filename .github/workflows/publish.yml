name: Publish DOTNXS to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (leave false to build artifacts only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; t=os.environ['RELEASE_TAG'].removeprefix('v'); assert v==t, f'tag {t} != project version {v}'"
      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel
      - name: Build platform wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; t=os.environ['RELEASE_TAG'].removeprefix('v'); assert v==t, f'tag {t} != project version {v}'"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source distribution
        run: python -m build --sdist
      - name: Check source distribution
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish == true
    name: Publish release to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dotnxs
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheelhouse-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
