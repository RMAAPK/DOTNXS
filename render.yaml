services:
  - type: web
    name: dotnxs-inkling-api
    runtime: python
    region: oregon
    plan: 2c-4g
    buildCommand: pip install -e ".[runtime]" -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NXS_REPO_ID
        value: rmaaorg/Inkling-2-Mini-NXS
      - key: NXS_FILENAME
        value: Inkling-2-Mini.nxs
      - key: DOTNXS_CACHE_BYTES
        value: "209715200"
      - key: DOTNXS_MAX_CONTEXT_TOKENS
        value: "64"
      - key: DOTNXS_MAX_NEW_TOKENS
        value: "12"
      - key: CORS_ORIGINS
        value: https://dotnxs.rmaa.pk,https://dotnxs-website.onrender.com,https://rmaaorg-dotnxs-demo.static.hf.space,https://rmaaorg-dotnxs-demo.hf.space,http://localhost:8000,http://127.0.0.1:8000

  - type: web
    name: dotnxs-website
    runtime: static
    buildCommand: echo "Static website; no build step required"
    staticPublishPath: ./website
    domains:
      - dotnxs.rmaa.pk
